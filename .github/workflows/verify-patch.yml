name: Verify Ayu Patch v0.3

on:
  workflow_dispatch:
  schedule:
    - cron: '33,38,43,48,53,58,3,8,13,18,23,28 * * * *'
  issues:
    types: [opened]
  push:
    paths:
      - 'apply_ayu_v03.py'
      - 'apply_ayu_profile_cache.py'
      - 'ci_verify_v03.py'
      - 'payload/**'
      - 'telegram-ref.txt'
      - '.github/workflows/verify-patch.yml'

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: ayu-v03-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'issues' || github.event.issue.title == 'Run Ayu v0.3 Verify'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify Ayu v0.3 against pinned Telegram
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 ci_verify_v03.py 2>&1 | tee ayu-verify.log

      - name: Report result and dispatch IPA
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail

          if [ "$VERIFY_OUTCOME" != "success" ]; then
            {
              echo "## ❌ Verify failed"
              echo
              echo "source: \`$GITHUB_SHA\`"
              echo "run: \`$GITHUB_RUN_ID\`"
              echo
              echo '```text'
              tail -n 300 ayu-verify.log 2>/dev/null || echo 'verify log missing'
              echo '```'
            } > /tmp/ayu-report.md
            gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/ayu-report.md
            exit 1
          fi

          cat > /tmp/ayu-success.md <<EOF
          ## ✅ Verify success

          source: \`$GITHUB_SHA\`
          run: \`$GITHUB_RUN_ID\`

          Dispatching **Build Telegram Ayu IPA v0.3.0** now.
          EOF
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/ayu-success.md

          gh workflow run build-ipa.yml --repo "$GITHUB_REPOSITORY" --ref main

          build_json=''
          for _ in $(seq 1 12); do
            sleep 3
            build_json="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-ipa.yml --limit 1 --json databaseId,status,conclusion,headSha,url,createdAt 2>/dev/null || true)"
            if [ -n "$build_json" ] && [ "$build_json" != '[]' ]; then
              break
            fi
          done

          if [ -z "$build_json" ] || [ "$build_json" = '[]' ]; then
            gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body '⚠️ Verify green, workflow dispatch returned successfully, but the IPA run did not appear in the run list within 36 seconds.'
            exit 1
          fi

          build_id="$(printf '%s' "$build_json" | jq -r '.[0].databaseId')"
          build_status="$(printf '%s' "$build_json" | jq -r '.[0].status')"
          build_sha="$(printf '%s' "$build_json" | jq -r '.[0].headSha')"
          build_url="$(printf '%s' "$build_json" | jq -r '.[0].url')"

          cat > /tmp/ayu-build-started.md <<EOF
          ## 🚀 IPA build started

          run_id: \`$build_id\`
          status: \`$build_status\`
          head: \`$build_sha\`
          $build_url
          EOF
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/ayu-build-started.md

          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/verify-patch.yml')
          text = p.read_text(encoding='utf-8')
          text = text.replace("  schedule:\n    - cron: '33,38,43,48,53,58,3,8,13,18,23,28 * * * *'\n", "")
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name 'ayu-ci'
          git config user.email 'ayu-ci@users.noreply.github.com'
          git add .github/workflows/verify-patch.yml
          if ! git diff --cached --quiet; then
            git commit -m 'CI: disable temporary Ayu verify schedule'
            git push origin HEAD:main
          fi
