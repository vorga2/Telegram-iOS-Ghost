name: Ayu v0.3 PR Verify + IPA

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ayu-v03-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned Telegram patch
        run: |
          python3 ci_verify_v03.py
          python3 ci_verify_hotfixes.py

  build_ipa:
    needs: verify
    if: "${{ startsWith(github.event.pull_request.title, 'CI: build Ayu v0.3 IPA') }}"
    runs-on: macos-26
    timeout-minutes: 360
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      AYU_BUILD_NUMBER: "3000"

    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TG_API_ID:-}" || { echo 'TG_API_ID missing'; exit 1; }
          test -n "${TG_API_HASH:-}" || { echo 'TG_API_HASH missing'; exit 1; }

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Checkout pinned Telegram source
        id: telegram-source
        shell: bash
        run: |
          set -euo pipefail
          REF="$(tr -d '[:space:]' < telegram-ref.txt)"
          test -n "$REF" || { echo "telegram-ref.txt is empty"; exit 1; }
          cd "$RUNNER_TEMP"
          rm -rf Telegram-iOS
          git init Telegram-iOS
          cd Telegram-iOS
          git remote add origin https://github.com/TelegramMessenger/Telegram-iOS.git
          git fetch --depth 1 origin "$REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1 --jobs 8
          ACTUAL_REF="$(git rev-parse HEAD)"
          test "$ACTUAL_REF" = "$REF" || { echo "Pinned Telegram ref mismatch: $ACTUAL_REF != $REF"; exit 1; }
          echo "Telegram ref: $ACTUAL_REF"
          echo "ref=$ACTUAL_REF" >> "$GITHUB_OUTPUT"

      - name: Restore Bazel caches
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/telegram-bazel-cache
            ~/telegram-bazel-user-root
          key: telegram-ios-v031-macos26-xcode262-${{ steps.telegram-source.outputs.ref }}-build${{ env.AYU_BUILD_NUMBER }}-${{ github.run_id }}
          restore-keys: |
            telegram-ios-v031-macos26-xcode262-${{ steps.telegram-source.outputs.ref }}-build${{ env.AYU_BUILD_NUMBER }}-
            telegram-ios-bazel-v030-macos26-xcode262-${{ steps.telegram-source.outputs.ref }}-
            telegram-ios-bazel-v025-macos26-xcode262-${{ steps.telegram-source.outputs.ref }}-

      - name: Apply Ayu patches
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/Telegram-iOS"
          python3 "$GITHUB_WORKSPACE/apply_ayu_v03_ui_v2.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/apply_ayu_profile_cache.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/apply_ayu_view_once.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/apply_ayu_view_once_durable.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/apply_ayu_view_once_burn.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/apply_ayu_stock_ui_guard.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/apply_ayu_deleted_background.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/apply_ayu_deleted_realtime.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/apply_ayu_manual_read_fix.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/apply_ayu_send_read.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/apply_ayu_behavior_anchor_compat.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/apply_ayu_behavior_hotfix.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/apply_ayu_deleted_archive.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/apply_ayu_files_visibility.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/apply_ayu_deleted_visual_hotfix.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/apply_ayu_deleted_visual_compile_fix.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/apply_ayu_presence_toggle_hotfix.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/apply_ayu_settings_categories.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/apply_ayu_spy_settings.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/apply_ayu_spy_edit_history.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/apply_ayu_spy_read_dates.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/apply_ayu_spy_details.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/apply_ayu_spy_content_read_dates.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/apply_ayu_customization_finish.py" "$ROOT"
          # Final idempotent cleanup after all patchers, so no later patch can
          # reintroduce the dead Telegram-theme local before Swift compilation.
          python3 "$GITHUB_WORKSPACE/apply_ayu_deleted_visual_compile_fix.py" "$ROOT"

      - name: Create build configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/Telegram-iOS"
          cat > build-system/ayu-ci-configuration.json <<EOF
          {
            "bundle_id": "ph.telegra.Telegraph",
            "api_id": "${TG_API_ID}",
            "api_hash": "${TG_API_HASH}",
            "team_id": "C67CF9S4VU",
            "app_center_id": "0",
            "is_internal_build": "true",
            "is_appstore_build": "false",
            "appstore_id": "0",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF
          python3 -m json.tool build-system/ayu-ci-configuration.json >/dev/null

      - name: Import fake signing certificates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/Telegram-iOS"
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          security find-identity -v -p codesigning || true

      - name: Fast compile check for Ayu-touched modules
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/Telegram-iOS"
          mkdir -p "$HOME/telegram-bazel-cache" "$HOME/telegram-bazel-user-root"

          targets=(
            "//submodules/Postbox:Postbox"
            "//submodules/TelegramCore:TelegramCore"
            "//submodules/TelegramUI/Components/Chat/ChatMessageDateAndStatusNode:ChatMessageDateAndStatusNode"
            "//submodules/TelegramUI/Components/Chat/ChatMessageBubbleItemNode:ChatMessageBubbleItemNode"
            "//submodules/TelegramUI/Components/Chat/ChatMessageItemImpl:ChatMessageItemImpl"
            "//submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen:PeerInfoScreen"
            "//submodules/TelegramUI:TelegramUI"
          )

          for target in "${targets[@]}"; do
            echo "=== Ayu compile-check: $target ==="
            python3 build-system/Make/Make.py \
              --bazelUserRoot="$HOME/telegram-bazel-user-root" \
              --cacheDir="$HOME/telegram-bazel-cache" \
              build \
              --configurationPath=build-system/ayu-ci-configuration.json \
              --codesigningInformationPath=build-system/fake-codesigning \
              --buildNumber="$AYU_BUILD_NUMBER" \
              --configuration=debug_arm64 \
              --target="$target"
          done

      - name: Build release arm64
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/Telegram-iOS"
          mkdir -p "$RUNNER_TEMP/output" "$HOME/telegram-bazel-cache" "$HOME/telegram-bazel-user-root"
          python3 build-system/Make/Make.py \
            --bazelUserRoot="$HOME/telegram-bazel-user-root" \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/ayu-ci-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber="$AYU_BUILD_NUMBER" \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath="$RUNNER_TEMP/output"

      - name: Prepare IPA
        id: ipa
        shell: bash
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/output/Telegram.ipa"
          test -f "$IPA" || { find "$RUNNER_TEMP/output" -type f -print; exit 1; }
          mv "$IPA" "$RUNNER_TEMP/output/AyuGram-iOS-v0.3.0.ipa"
          echo "path=$RUNNER_TEMP/output/AyuGram-iOS-v0.3.0.ipa" >> "$GITHUB_OUTPUT"
          ls -lh "$RUNNER_TEMP/output/AyuGram-iOS-v0.3.0.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-iOS-v0.3.0-IPA
          path: ${{ steps.ipa.outputs.path }}
          compression-level: 0
          if-no-files-found: error

      - name: Save Bazel caches
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/telegram-bazel-cache
            ~/telegram-bazel-user-root
          key: telegram-ios-v031-macos26-xcode262-${{ steps.telegram-source.outputs.ref }}-build${{ env.AYU_BUILD_NUMBER }}-${{ github.run_id }}
