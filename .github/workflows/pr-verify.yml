name: Ayu Ghost-only Theme Repair V2 IPA

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ayu-theme-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify Ghost-only theme repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile apply_ayu_ghost_only.py apply_ayu_branding_only.py apply_ayu_theme_repair.py
          REF="$(tr -d '[:space:]' < telegram-ref.txt)"
          ROOT="$RUNNER_TEMP/Telegram-iOS"
          git init "$ROOT"
          cd "$ROOT"
          git remote add origin https://github.com/TelegramMessenger/Telegram-iOS.git
          git fetch --depth 1 origin "$REF"
          git checkout --detach FETCH_HEAD
          python3 "$GITHUB_WORKSPACE/apply_ayu_ghost_only.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/apply_ayu_branding_only.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/apply_ayu_theme_repair.py" "$ROOT"

          RUNTIME="submodules/TelegramCore/Sources/State/AyuRuntimeSettings.swift"
          SETTINGS="submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/AyuSettingsController.swift"
          ! grep -Eqi 'deleted|удал[её]н|spy|history|archive' "$RUNTIME" "$SETTINGS"

          # Deleted/message render paths must still be stock Telegram.
          for path in \
            submodules/TelegramCore/Sources/State/AccountStateManagementUtils.swift \
            submodules/TelegramUI/Components/Chat/ChatMessageDateAndStatusNode/Sources/StringForMessageTimestampStatus.swift \
            submodules/TelegramUI/Components/Chat/ChatMessageDateAndStatusNode/Sources/ChatMessageDateAndStatusNode.swift \
            submodules/TelegramUI/Components/Chat/ChatMessageItemImpl/Sources/ChatMessageItemImpl.swift \
            submodules/TelegramUI/Components/Chat/ChatMessageReplyInfoNode/Sources/ChatMessageReplyInfoNode.swift \
            submodules/TelegramUI/Sources/ChatPinnedMessageTitlePanelNode.swift \
            submodules/TelegramUI/Components/PeerInfo/PeerInfoVisualMediaPaneNode/Sources/PeerInfoGiftsPaneNode.swift \
            submodules/TelegramUI/Components/LiquidLens/Sources/LiquidLensView.swift \
            submodules/TelegramUI/Components/TabBarComponent/Sources/TabBarComponent.swift \
            submodules/TabBarUI/Sources/TabBarContollerNode.swift \
            submodules/TelegramPresentationData/Sources/PresentationData.swift
          do
            git diff --exit-code HEAD -- "$path"
          done

          grep -q 'AYU_THEME_STATE_REPAIR_v1' submodules/TelegramUI/Sources/SharedAccountContext.swift
          grep -q 'AYU_CLOUD_THEME_FAMILY_FALLBACK_v1' submodules/TelegramPresentationData/Sources/MakePresentationTheme.swift
          grep -q 'AYU_IOS27_SCENE_TRAIT_REPAIR_v2' submodules/Display/Source/NativeWindowHostView.swift
          ! grep -q 'else if #available(iOS 12.0' submodules/Display/Source/NativeWindowHostView.swift
          grep -q 'AYU_FINAL_THEME_WINDOW_APPEARANCE_v2' submodules/TelegramUI/Sources/SharedAccountContext.swift
          grep -q 'AYU_PREFERRED_NIGHT_THEME_PERSISTENCE_v2' submodules/SettingsUI/Sources/Themes/ThemeSettingsController.swift
          ! grep -q 'return current.withUpdatedTheme(updatedTheme).withUpdatedAutomaticThemeSwitchSetting(updatedAutomaticThemeSwitchSetting)' submodules/SettingsUI/Sources/Themes/ThemeSettingsController.swift
          grep -q 'theme: .builtin(.dayClassic)' submodules/TelegramUI/Sources/SharedAccountContext.swift
          grep -q 'automaticThemeSwitchSetting: AutomaticThemeSwitchSetting(force: false, trigger: .system, theme: .builtin(.night))' submodules/TelegramUI/Sources/SharedAccountContext.swift
          echo '=== GHOST-ONLY THEME REPAIR VERIFY SUCCESS ==='

  build_ipa:
    needs: verify
    if: "${{ startsWith(github.event.pull_request.title, 'CI: build Ayu ThemeRepair') }}"
    runs-on: macos-26
    timeout-minutes: 360
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TG_API_ID:-}"
          test -n "${TG_API_HASH:-}"
      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
      - name: Checkout pinned Telegram source
        id: telegram-source
        shell: bash
        run: |
          set -euo pipefail
          REF="$(tr -d '[:space:]' < telegram-ref.txt)"
          cd "$RUNNER_TEMP"
          rm -rf Telegram-iOS
          git init Telegram-iOS
          cd Telegram-iOS
          git remote add origin https://github.com/TelegramMessenger/Telegram-iOS.git
          git fetch --depth 1 origin "$REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1 --jobs 8
          ACTUAL_REF="$(git rev-parse HEAD)"
          test "$ACTUAL_REF" = "$REF"
          echo "ref=$ACTUAL_REF" >> "$GITHUB_OUTPUT"
      - name: Restore Bazel disk cache
        uses: actions/cache/restore@v4
        with:
          path: ~/telegram-bazel-cache
          key: telegram-ios-themerepair-${{ steps.telegram-source.outputs.ref }}-${{ github.run_id }}
          restore-keys: |
            telegram-ios-ghostonly-${{ steps.telegram-source.outputs.ref }}-
            telegram-ios-bazel-v030-macos26-xcode262-${{ steps.telegram-source.outputs.ref }}-
      - name: Apply Ghost-only Ayu patch
        run: python3 "$GITHUB_WORKSPACE/apply_ayu_ghost_only.py" "$RUNNER_TEMP/Telegram-iOS"
      - name: Apply AyuGram branding only
        run: python3 "$GITHUB_WORKSPACE/apply_ayu_branding_only.py" "$RUNNER_TEMP/Telegram-iOS"
      - name: Apply theme state and custom-theme repair
        run: python3 "$GITHUB_WORKSPACE/apply_ayu_theme_repair.py" "$RUNNER_TEMP/Telegram-iOS"
      - name: Assert deleted render paths stay stock
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/Telegram-iOS"
          git diff --exit-code HEAD -- submodules/TelegramCore/Sources/State/AccountStateManagementUtils.swift
          git diff --exit-code HEAD -- submodules/TelegramUI/Components/Chat/ChatMessageReplyInfoNode/Sources/ChatMessageReplyInfoNode.swift
          git diff --exit-code HEAD -- submodules/TelegramUI/Components/LiquidLens/Sources/LiquidLensView.swift
          git diff --exit-code HEAD -- submodules/TelegramUI/Components/TabBarComponent/Sources/TabBarComponent.swift
          git diff --exit-code HEAD -- submodules/TabBarUI/Sources/TabBarContollerNode.swift
          git diff --exit-code HEAD -- submodules/TelegramPresentationData/Sources/PresentationData.swift
          grep -q 'AYU_THEME_STATE_REPAIR_v1' submodules/TelegramUI/Sources/SharedAccountContext.swift
          grep -q 'AYU_CLOUD_THEME_FAMILY_FALLBACK_v1' submodules/TelegramPresentationData/Sources/MakePresentationTheme.swift
          grep -q 'AYU_IOS27_SCENE_TRAIT_REPAIR_v2' submodules/Display/Source/NativeWindowHostView.swift
          ! grep -q 'else if #available(iOS 12.0' submodules/Display/Source/NativeWindowHostView.swift
          grep -q 'AYU_FINAL_THEME_WINDOW_APPEARANCE_v2' submodules/TelegramUI/Sources/SharedAccountContext.swift
          grep -q 'AYU_PREFERRED_NIGHT_THEME_PERSISTENCE_v2' submodules/SettingsUI/Sources/Themes/ThemeSettingsController.swift
      - name: Create build configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/Telegram-iOS"
          cat > build-system/ayu-ci-configuration.json <<EOF
          {
            "bundle_id": "ph.telegra.Telegraph",
            "api_id": "${TG_API_ID}",
            "api_hash": "${TG_API_HASH}",
            "team_id": "C67CF9S4VU",
            "app_center_id": "0",
            "is_internal_build": "true",
            "is_appstore_build": "false",
            "appstore_id": "0",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF
          python3 -m json.tool build-system/ayu-ci-configuration.json >/dev/null
      - name: Import fake signing certificates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/Telegram-iOS"
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          security find-identity -v -p codesigning || true
      - name: Build release arm64
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/Telegram-iOS"
          mkdir -p "$RUNNER_TEMP/output"
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/ayu-ci-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber="$GITHUB_RUN_NUMBER" \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath="$RUNNER_TEMP/output"
      - name: Prepare IPA
        id: ipa
        shell: bash
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/output/Telegram.ipa"
          test -f "$IPA"
          mv "$IPA" "$RUNNER_TEMP/output/AyuGram-GhostOnly-ThemeRepairV2.ipa"
          echo "path=$RUNNER_TEMP/output/AyuGram-GhostOnly-ThemeRepairV2.ipa" >> "$GITHUB_OUTPUT"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-GhostOnly-ThemeRepairV2-IPA
          path: ${{ steps.ipa.outputs.path }}
          compression-level: 0
          if-no-files-found: error
      - name: Save Bazel disk cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/telegram-bazel-cache
          key: telegram-ios-themerepair-${{ steps.telegram-source.outputs.ref }}-${{ github.run_id }}
