name: Ayu v0.3 PR Verify + IPA

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned Telegram patch
        run: python3 ci_verify_v03.py

  build_ipa:
    needs: verify
    if: "${{ startsWith(github.event.pull_request.title, 'CI: build Ayu v0.3 IPA') }}"
    runs-on: macos-26
    timeout-minutes: 360
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}

    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TG_API_ID:-}" || { echo 'TG_API_ID missing'; exit 1; }
          test -n "${TG_API_HASH:-}" || { echo 'TG_API_HASH missing'; exit 1; }

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Checkout pinned Telegram source
        id: telegram-source
        shell: bash
        run: |
          set -euo pipefail
          REF="$(tr -d '[:space:]' < telegram-ref.txt)"
          test -n "$REF" || { echo 'telegram-ref.txt is empty'; exit 1; }
          cd "$RUNNER_TEMP"
          rm -rf Telegram-iOS
          git init Telegram-iOS
          cd Telegram-iOS
          git remote add origin https://github.com/TelegramMessenger/Telegram-iOS.git
          git fetch --depth 1 origin "$REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1 --jobs 8
          ACTUAL_REF="$(git rev-parse HEAD)"
          test "$ACTUAL_REF" = "$REF" || { echo "Pinned Telegram ref mismatch: $ACTUAL_REF != $REF"; exit 1; }
          echo "Telegram ref: $ACTUAL_REF"
          echo "ref=$ACTUAL_REF" >> "$GITHUB_OUTPUT"

      - name: Restore Bazel disk cache
        uses: actions/cache/restore@v4
        with:
          path: ~/telegram-bazel-cache
          key: telegram-ios-bazel-v030-macos26-xcode262-${{ steps.telegram-source.outputs.ref }}-${{ github.run_id }}
          restore-keys: |
            telegram-ios-bazel-v030-macos26-xcode262-${{ steps.telegram-source.outputs.ref }}-
            telegram-ios-bazel-v025-macos26-xcode262-${{ steps.telegram-source.outputs.ref }}-

      - name: Apply Ayu v0.3 UI v2 patcher
        run: python3 "$GITHUB_WORKSPACE/apply_ayu_v03_ui_v2.py" "$RUNNER_TEMP/Telegram-iOS"

      - name: Apply Ayu profile cache
        run: python3 "$GITHUB_WORKSPACE/apply_ayu_profile_cache.py" "$RUNNER_TEMP/Telegram-iOS"

      - name: Apply Ayu view-once preservation
        run: python3 "$GITHUB_WORKSPACE/apply_ayu_view_once.py" "$RUNNER_TEMP/Telegram-iOS"

      - name: Apply durable view-once persistence
        run: python3 "$GITHUB_WORKSPACE/apply_ayu_view_once_durable.py" "$RUNNER_TEMP/Telegram-iOS"

      - name: Apply view-once burn action
        run: python3 "$GITHUB_WORKSPACE/apply_ayu_view_once_burn.py" "$RUNNER_TEMP/Telegram-iOS"

      - name: Restore stock Telegram date and status UI
        run: python3 "$GITHUB_WORKSPACE/apply_ayu_stock_ui_guard.py" "$RUNNER_TEMP/Telegram-iOS"

      - name: Apply deleted bubble background
        run: python3 "$GITHUB_WORKSPACE/apply_ayu_deleted_background.py" "$RUNNER_TEMP/Telegram-iOS"

      - name: Apply real-time deleted message retention
        run: python3 "$GITHUB_WORKSPACE/apply_ayu_deleted_realtime.py" "$RUNNER_TEMP/Telegram-iOS"

      - name: Fix one-shot manual read synchronization
        run: python3 "$GITHUB_WORKSPACE/apply_ayu_manual_read_fix.py" "$RUNNER_TEMP/Telegram-iOS"

      - name: Read current chat on send
        run: python3 "$GITHUB_WORKSPACE/apply_ayu_send_read.py" "$RUNNER_TEMP/Telegram-iOS"

      - name: Apply behavior hotfixes
        run: python3 "$GITHUB_WORKSPACE/apply_ayu_behavior_hotfix.py" "$RUNNER_TEMP/Telegram-iOS"

      - name: Restore deleted marker and Telegram-theme background default
        run: python3 "$GITHUB_WORKSPACE/apply_ayu_deleted_visual_hotfix.py" "$RUNNER_TEMP/Telegram-iOS"

      - name: Apply Ghost presence immediately on toggle
        run: python3 "$GITHUB_WORKSPACE/apply_ayu_presence_toggle_hotfix.py" "$RUNNER_TEMP/Telegram-iOS"

      - name: Create build configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/Telegram-iOS"
          cat > build-system/ayu-ci-configuration.json <<EOF
          {
            "bundle_id": "ph.telegra.Telegraph",
            "api_id": "${TG_API_ID}",
            "api_hash": "${TG_API_HASH}",
            "team_id": "C67CF9S4VU",
            "app_center_id": "0",
            "is_internal_build": "true",
            "is_appstore_build": "false",
            "appstore_id": "0",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF
          python3 -m json.tool build-system/ayu-ci-configuration.json >/dev/null

      - name: Import fake signing certificates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/Telegram-iOS"
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          security find-identity -v -p codesigning || true

      - name: Build release arm64
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/Telegram-iOS"
          mkdir -p "$RUNNER_TEMP/output"
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/ayu-ci-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber="$GITHUB_RUN_NUMBER" \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath="$RUNNER_TEMP/output"

      - name: Prepare IPA
        id: ipa
        shell: bash
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/output/Telegram.ipa"
          test -f "$IPA" || { find "$RUNNER_TEMP/output" -type f -print; exit 1; }
          mv "$IPA" "$RUNNER_TEMP/output/AyuGram-iOS-v0.3.0.ipa"
          echo "path=$RUNNER_TEMP/output/AyuGram-iOS-v0.3.0.ipa" >> "$GITHUB_OUTPUT"
          ls -lh "$RUNNER_TEMP/output/AyuGram-iOS-v0.3.0.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-iOS-v0.3.0-IPA
          path: ${{ steps.ipa.outputs.path }}
          compression-level: 0
          if-no-files-found: error

      - name: Save Bazel disk cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/telegram-bazel-cache
          key: telegram-ios-bazel-v030-macos26-xcode262-${{ steps.telegram-source.outputs.ref }}-${{ github.run_id }}
